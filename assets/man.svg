<text x="40" y="74" class="h" text-anchor="start" xml:space="preserve">NAME</text>
<text x="68" y="96" class="w" text-anchor="start" xml:space="preserve"><tspan class="h">pejas</tspan> — developer &amp; artist</text>
<text x="40" y="130" class="h" text-anchor="start" xml:space="preserve">SYNOPSIS</text>
<text x="68" y="152" class="w" text-anchor="start" xml:space="preserve"><tspan class="h">pejas</tspan> <tspan class="d">[</tspan><tspan class="w" text-decoration="underline">--code</tspan><tspan class="d">]</tspan> <tspan class="d">[</tspan><tspan class="w" text-decoration="underline">--draw</tspan><tspan class="d">]</tspan> <tspan class="d">[</tspan><tspan class="w" text-decoration="underline">--learn</tspan><tspan class="d">]</tspan> <tspan class="w" text-decoration="underline">&lt;idea&gt;</tspan></text>
<text x="40" y="186" class="h" text-anchor="start" xml:space="preserve">DESCRIPTION</text>
<text x="68" y="208" class="" text-anchor="start" xml:space="preserve">Builds small things for the web and the terminal.</text>
<text x="68" y="228" class="" text-anchor="start" xml:space="preserve">Draws when the code doesn't compile.</text>
<text x="68" y="248" class="" text-anchor="start" xml:space="preserve">Prefers dark rooms, monospace and black holes.</text>
<text x="560" y="74" class="h" text-anchor="start" xml:space="preserve">STACK</text>
<text x="588" y="96" class="w" text-anchor="start" xml:space="preserve">python <tspan class="d">·</tspan> javascript <tspan class="d">·</tspan> typescript</text>
