<svg xmlns="http://www.w3.org/2000/svg" width="105" height="36" viewBox="0 0 105 36" role="img" aria-label="gh P3jas"><style>
.m{font-family:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.cur{animation:blink 1.1s steps(1) infinite}
