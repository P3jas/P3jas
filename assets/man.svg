<text x="588" y="136" class="w" text-anchor="start" xml:space="preserve">git <tspan class="d">·</tspan> linux</text>
<text x="560" y="170" class="h" text-anchor="start" xml:space="preserve">NOW</text>
<text x="588" y="192" class="w" text-anchor="start" xml:space="preserve"><tspan class="d">→</tspan> working on: something new</text>
<text x="588" y="212" class="w" text-anchor="start" xml:space="preserve"><tspan class="d">→</tspan> learning:   one thing at a time</text>
